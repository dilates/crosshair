<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>dilates-crosshair-overlay</title>
  <style>
    * { margin: 0; padding: 0; user-select: none; }
    html, body {
      width: 100%;
      height: 100%;
      background: transparent;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    #crosshair {
      width: 100%;
      height: 100%;
      object-fit: contain;
      pointer-events: none;
    }
    #crosshair-solid {
      width: 100%;
      height: 100%;
      pointer-events: none;
      -webkit-mask-size: contain;
      -webkit-mask-position: center;
      -webkit-mask-repeat: no-repeat;
      mask-size: contain;
      mask-position: center;
      mask-repeat: no-repeat;
    }
  </style>
</head>
<body>
  <img id="crosshair" alt="" />
  <div id="crosshair-solid" hidden></div>
  <script src="cross-style.js"></script>
  <script>
    const img = document.getElementById('crosshair');
    const solid = document.getElementById('crosshair-solid');
    if (window.overlay) {
      window.overlay.onInit((data) => {
        if (data.fillColor) {
          img.hidden = true;
          solid.hidden = false;
          window.CrossStyle.applyToSolid(solid, data);
        } else {
          solid.hidden = true;
          img.hidden = false;
          window.CrossStyle.applyToImg(img, data);
        }
      });
    }
  </script>
</body>
</html>
